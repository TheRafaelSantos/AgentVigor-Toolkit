name: CI

on:
  push:
    branches: [main, 'agentvigor/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, node: 22 }
          - { os: windows-2025, node: 24 }
          - { os: ubuntu-24.04, node: 24 }
          - { os: ubuntu-24.04, node: 26 }
          - { os: macos-15-intel, node: 24 }
          - { os: macos-26, node: 24 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node -p "process.platform + ' ' + process.arch + ' ' + process.version"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run smoke:package
      - name: Verify official RTK binaries and offline rollback
        run: node scripts/smoke-rtk-binary.mjs
